[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "postfinder"
version = "0.1.0"
description = "Find post offices, parcel lockers and post boxes near a point, and look up postcodes. Free and keyless."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "PostFinder" }]
keywords = [
  "post office locator",
  "parcel locker api",
  "post box locations",
  "postcode api",
  "postcode lookup",
  "australia post locations",
  "store locator api",
  "nearest location api",
  "openstreetmap",
  "geonames",
  "australia",
  "new zealand",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: GIS",
  "Typing :: Typed",
]
# No dependencies, on purpose. The whole client is one urllib call and a set of
# dataclasses; asking for requests would make this the heaviest thing in
# somebody's lambda for no gain.
dependencies = []

[project.urls]
Homepage = "https://postfinder.io"
Documentation = "https://postfinder.io/en/docs/"
Source = "https://github.com/postfinder/postfinder-python"
Changelog = "https://github.com/postfinder/postfinder-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/postfinder"]
